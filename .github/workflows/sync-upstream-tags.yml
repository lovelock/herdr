name: Sync upstream tags

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: herdrdev/herdr

concurrency:
  group: sync-upstream-tags
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "refs/tags/*:refs/tags/*"

      - name: Push missing tags
        run: |
          set -euo pipefail
          git ls-remote --tags origin \
            | awk '{print $2}' \
            | sed 's#^refs/tags/##; s#\^{}$##' \
            | sort -u > "$RUNNER_TEMP/origin-tags.txt"

          failed=0
          while read -r tag; do
            if grep -qxF "$tag" "$RUNNER_TEMP/origin-tags.txt"; then
              continue
            fi
            echo "pushing $tag"
            if ! git push origin "refs/tags/$tag"; then
              echo "::warning::failed to push tag $tag" >&2
              failed=1
            fi
          done < <(git tag --list)

          if [ "$failed" -ne 0 ]; then
            echo "::error::some upstream tags could not be pushed" >&2
            exit 1
          fi
